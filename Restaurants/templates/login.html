<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants | Iniciar sesion</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f1a;
            --panel: #161628;
            --card: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.12);
            --accent: #c9a84c;
            --text: #f3f3f8;
            --muted: #9c9cb7;
            --danger: #f07a7a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            background:
                radial-gradient(circle at top right, rgba(201,168,76,0.12), transparent 25%),
                radial-gradient(circle at bottom left, rgba(51,102,153,0.16), transparent 28%),
                linear-gradient(135deg, #0a0a16, #131326 45%, #102031);
            color: var(--text);
            display: grid;
            grid-template-columns: minmax(280px, 1fr) minmax(360px, 460px);
        }
        .hero, .panel { padding: 56px; }
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }
        .eyebrow {
            font-size: 12px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--accent);
            text-align: center;
        }
        .hero h1 {
            font-size: clamp(36px, 5vw, 64px);
            font-weight: 600;
            line-height: 1.05;
            max-width: 560px;
            text-align: center;
        }
        .hero p {
            max-width: 520px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.7;
            text-align: center;
        }
        .panel {
            background: rgba(12,12,22,0.74);
            border-left: 1px solid var(--border);
            display: flex;
            align-items: center;
        }
        .card {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px;
            backdrop-filter: blur(16px);
        }
        .card h2 { font-size: 28px; margin-bottom: 8px; }
        .card p { color: var(--muted); margin-bottom: 24px; }
        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 14px;
            background: rgba(240,122,122,0.12);
            border: 1px solid rgba(240,122,122,0.22);
            color: #ffd5d5;
        }
        form { display: grid; gap: 16px; }
        label {
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
            display: block;
        }
        input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            color: var(--text);
            font: inherit;
        }
        input:focus {
            outline: none;
            border-color: rgba(201,168,76,0.6);
        }
        button {
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            padding: 14px 18px;
            background: var(--accent);
            color: #12121d;
            font: 600 14px "DM Sans", sans-serif;
            cursor: pointer;
        }
        .foot {
            margin-top: 18px;
            color: var(--muted);
            font-size: 14px;
        }
        .foot a {
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.35);
        }
        @media (max-width: 900px) {
            body { grid-template-columns: 1fr; }
            .hero { padding-bottom: 24px; }
            .panel { border-left: none; border-top: 1px solid var(--border); }
        }
    </style>
</head>
<body>
    <section class="hero">
        <span class="eyebrow">Restaurants</span>
        <h1>Bienvenido.</h1>
        <p>Inicia sesion para continuar.</p>
    </section>

    <section class="panel">
        <div class="card">
            <h2>Iniciar sesion</h2>
            <p>Accede con tu nombre de usuario y contraseña.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div>
                    <label for="username">Usuario</label>
                    <input id="username" name="username" type="text" required autofocus>
                </div>
                <div>
                    <label for="password">Contrasena</label>
                    <input id="password" name="password" type="password" required>
                </div>
                <button type="submit">Entrar</button>
            </form>

            <div class="foot">
                No tienes cuenta? <a href="{% url 'registro' %}">Registrate aqui</a>
            </div>
        </div>
    </section>
</body>
</html>
