<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants | Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f1a;
            --card: #18182b;
            --border: #2c2c45;
            --accent: #c9a84c;
            --text: #f4f4f8;
            --muted: #9898b2;
            --danger: #f07a7a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            background:
                radial-gradient(circle at top right, rgba(201,168,76,0.14), transparent 22%),
                radial-gradient(circle at bottom left, rgba(56,92,150,0.14), transparent 26%),
                linear-gradient(135deg, #0a0a16, #121225 40%, #132338);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px 16px;
        }
        .card {
            width: min(720px, 100%);
            background: rgba(24,24,43,0.94);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            backdrop-filter: blur(14px);
        }
        h1 { font-size: 28px; margin-bottom: 8px; }
        .subtitle { color: var(--muted); margin-bottom: 24px; }
        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            background: rgba(240,122,122,0.12);
            border: 1px solid rgba(240,122,122,0.22);
            color: #ffd8d8;
        }
        form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }
        .full { grid-column: 1 / -1; }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--muted);
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font: inherit;
        }
        input:focus {
            outline: none;
            border-color: rgba(201,168,76,0.65);
        }
        .actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        button, .link-back {
            border-radius: 10px;
            padding: 14px 18px;
            font: 600 14px "DM Sans", sans-serif;
            text-decoration: none;
        }
        button {
            border: none;
            background: var(--accent);
            color: #151521;
            cursor: pointer;
        }
        .link-back {
            border: 1px solid var(--border);
            color: var(--text);
        }
        @media (max-width: 720px) {
            form { grid-template-columns: 1fr; }
            .full, .actions { grid-column: auto; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Crear cuenta</h1>
        <p class="subtitle">Registra un cliente nuevo para consultar menu e historial.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div>
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text" value="{{ form_data.nombre|default:'' }}" required>
            </div>
            <div>
                <label for="apellido_paterno">Apellido paterno</label>
                <input id="apellido_paterno" name="apellido_paterno" type="text" value="{{ form_data.apellido_paterno|default:'' }}" required>
            </div>
            <div>
                <label for="apellido_materno">Apellido materno</label>
                <input id="apellido_materno" name="apellido_materno" type="text" value="{{ form_data.apellido_materno|default:'' }}">
            </div>
            <div>
                <label for="numero_celular">Numero celular</label>
                <input id="numero_celular" name="numero_celular" type="tel" value="{{ form_data.numero_celular|default:'' }}" required>
            </div>
            <div class="full">
                <label for="nombre_usuario">Nombre de usuario</label>
                <input id="nombre_usuario" name="nombre_usuario" type="text" value="{{ form_data.nombre_usuario|default:'' }}" required>
            </div>
            <div>
                <label for="password">Contrasena</label>
                <input id="password" name="password" type="password" required>
            </div>
            <div>
                <label for="password_confirm">Confirmar contrasena</label>
                <input id="password_confirm" name="password_confirm" type="password" required>
            </div>
            <div class="actions">
                <button type="submit">Registrar cuenta</button>
                <a class="link-back" href="{% url 'login' %}">Volver al inicio</a>
            </div>
        </form>
    </div>
</body>
</html>
