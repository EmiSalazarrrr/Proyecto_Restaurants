<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>!function(){var t=localStorage.getItem('theme');t&&document.documentElement.setAttribute('data-theme',t)}();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canjear Ticket | Restaurants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
    <style>
        :root {
            --bg: #F8F3F0;
            --card: #FFFFFF;
            --border: rgba(0,32,91,0.10);
            --blue: #014BAA;
            --blue-light: #307FE2;
            --amber: #F2A900;
            --dark: #00205B;
            --muted: rgba(0,32,91,0.50);
            --success: #1E8A4C;
            --danger: #C0392B;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            color: var(--dark);
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        /* ── Brand ── */
        .brand-wrap {
            text-align: center;
            margin-bottom: 28px;
            animation: fadeDown 0.6s ease 0.1s both;
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .brand-tag {
            display: inline-block;
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #FFFFFF;
            font-family: "DM Mono", monospace;
            background: var(--blue);
            border-radius: 999px;
            padding: 5px 16px;
            margin-bottom: 10px;
        }
        .brand-wrap h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; color: var(--dark); }

        /* ── Card ── */
        .card {
            width: min(420px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 36px 32px 32px;
            box-shadow: 0 8px 32px rgba(0,32,91,0.10);
            animation: cardUp 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) 0.3s both;
        }
        @keyframes cardUp {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-icon {
            font-size: 40px;
            display: block;
            text-align: center;
            margin-bottom: 14px;
        }
        .card-title {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
            color: var(--dark);
        }
        .card-divider {
            width: 36px; height: 3px;
            background: var(--amber);
            border-radius: 2px;
            margin: 12px auto 16px;
        }
        .card-sub {
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            line-height: 1.65;
            margin-bottom: 28px;
        }

        /* ── Alert ── */
        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
            animation: fadeIn 0.3s ease both;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .alert.success { background: rgba(30,138,76,0.08); border: 1px solid rgba(30,138,76,0.25); color: #1E8A4C; }
        .alert.error   { background: rgba(192,57,43,0.08); border: 1px solid rgba(192,57,43,0.25); color: #C0392B; }

        /* ── Input ── */
        .field { margin-bottom: 20px; }
        .field-label {
            display: block;
            font-size: 10px;
            color: var(--blue);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .code-input {
            width: 100%;
            padding: 15px 18px;
            background: #F8F3F0;
            border: 2px solid rgba(0,32,91,0.12);
            border-radius: 11px;
            font: 22px "DM Mono", monospace;
            color: var(--dark);
            letter-spacing: 6px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .code-input:focus {
            border-color: var(--blue-light);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(48,127,226,0.12);
        }
        .code-input::placeholder { color: rgba(0,32,91,0.22); letter-spacing: 4px; font-size: 18px; }

        /* ── Buttons ── */
        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: var(--blue);
            color: #FFFFFF;
            font: 600 14px "DM Sans", sans-serif;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: opacity 0.15s, transform 0.15s;
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.10), transparent 60%);
            pointer-events: none;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }

        .btn-ghost {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid rgba(0,32,91,0.15);
            border-radius: 11px;
            color: var(--muted);
            font: 13px "DM Sans", sans-serif;
            text-decoration: none;
            text-align: center;
            transition: all 0.15s;
            margin-bottom: 8px;
        }
        .btn-ghost:hover { border-color: var(--blue); color: var(--blue); background: rgba(1,75,170,0.04); }

        /* Modo oscuro heredado de la vista de usuario */
        html[data-theme="dark"] {
            --bg: #111827;
            --card: #1a2035;
            --border: rgba(255,255,255,0.07);
            --blue: #D8AE48;
            --blue-light: #D8AE48;
            --amber: #D8AE48;
            --dark: #e2ddd5;
            --muted: #8f8173;
            --success: #4cc970;
            --danger: #f07a7a;
        }
        html[data-theme="dark"] .brand-tag {
            background: #090d14;
            border: 1px solid rgba(216,174,72,0.35);
            color: var(--amber);
        }
        html[data-theme="dark"] .card {
            background: var(--card);
            border-color: var(--border);
            box-shadow: 0 16px 42px rgba(0,0,0,0.30);
        }
        html[data-theme="dark"] .code-input {
            background: #151b27;
            border-color: rgba(255,255,255,0.10);
            color: var(--dark);
        }
        html[data-theme="dark"] .code-input:focus {
            background: #151b27;
            border-color: rgba(216,174,72,0.65);
            box-shadow: 0 0 0 3px rgba(216,174,72,0.12);
        }
        html[data-theme="dark"] .code-input::placeholder { color: rgba(226,221,213,0.25); }
        html[data-theme="dark"] .btn-primary {
            background: var(--amber);
            color: #0D1E3B;
        }
        html[data-theme="dark"] .btn-ghost {
            border-color: rgba(255,255,255,0.10);
            color: var(--muted);
        }
        html[data-theme="dark"] .btn-ghost:hover {
            border-color: rgba(216,174,72,0.45);
            color: var(--amber);
            background: rgba(216,174,72,0.08);
        }
        html[data-theme="dark"] .alert.success {
            background: rgba(76,201,112,0.08);
            border-color: rgba(76,201,112,0.18);
            color: var(--success);
        }
        html[data-theme="dark"] .alert.error {
            background: rgba(240,122,122,0.08);
            border-color: rgba(240,122,122,0.18);
            color: var(--danger);
        }

    </style>
    <link rel="stylesheet" href="/static/css/performance.css">
</head>
<body>
    <div class="brand-wrap">
        <div class="brand-tag">Restaurants</div>
        <h1>Canjear ticket</h1>
    </div>

    <div class="card">
        <span class="card-icon">🎫</span>
        <h2 class="card-title">Ingresa tu codigo</h2>
        <div class="card-divider"></div>
        <p class="card-sub">Escribe el numero de 6 digitos que aparece en tu ticket para registrarlo en tu cuenta.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if 'exitosamente' in message.message or message.tags == 'success' %}success{% else %}error{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'canjear_ticket' %}">
            {% csrf_token %}
            <div class="field">
                <label class="field-label" for="codigo">Codigo del ticket</label>
                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    class="code-input"
                    placeholder="000000"
                    maxlength="10"
                    autocomplete="off"
                    autofocus
                    inputmode="numeric"
                />
            </div>
            <button class="btn-primary" type="submit">Registrar ticket</button>
        </form>

        <a class="btn-ghost" href="{% url 'menu_cliente' %}">← Volver a mi cuenta</a>
        <a class="btn-ghost" href="{% url 'historial' %}">📋 Ver historial</a>
    </div>
</body>
</html>
