<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canjear Ticket | Restaurants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
    <style>
        :root {
            --bg: #0f0f1a;
            --panel: rgba(255,255,255,0.055);
            --border: rgba(255,255,255,0.09);
            --accent: #c9a84c;
            --accent-dim: rgba(201,168,76,0.12);
            --text: #f1f1f6;
            --muted: #9696b0;
            --success: #4cc970;
            --danger: #f07a7a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            color: var(--text);
            background:
                radial-gradient(ellipse at 75% 8%,  rgba(201,168,76,0.14), transparent 32%),
                radial-gradient(ellipse at 8%  88%, rgba(51,90,160,0.18),  transparent 32%),
                linear-gradient(135deg, #09091a, #111224 45%, #0d1c2e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        /* Decorative orb */
        body::before {
            content: '';
            position: fixed;
            width: 500px; height: 500px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201,168,76,0.05), transparent 65%);
            pointer-events: none;
            animation: pulse 8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50%       { transform: translate(-50%, -50%) scale(1.15); }
        }

        /* ── Brand ── */
        .brand-wrap {
            text-align: center;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
            animation: fadeDown 0.6s ease 0.1s both;
        }
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .brand-tag {
            display: inline-block;
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--accent);
            font-family: "DM Mono", monospace;
            border: 1px solid rgba(201,168,76,0.35);
            border-radius: 999px;
            padding: 5px 16px;
            margin-bottom: 10px;
        }
        .brand-wrap h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }

        /* ── Card ── */
        .card {
            position: relative;
            z-index: 1;
            width: min(420px, 100%);
            background: rgba(16,16,30,0.92);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 36px 32px 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 28px 70px rgba(0,0,0,0.4);
            animation: cardUp 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) 0.3s both;
        }
        @keyframes cardUp {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0)    scale(1); }
        }

        .card-icon {
            font-size: 40px;
            display: block;
            text-align: center;
            margin-bottom: 14px;
            filter: drop-shadow(0 0 14px rgba(201,168,76,0.35));
        }
        .card-title {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }
        .card-divider {
            width: 36px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            border-radius: 2px;
            margin: 12px auto 16px;
        }
        .card-sub {
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            line-height: 1.65;
            margin-bottom: 28px;
        }

        /* ── Alert ── */
        .alert {
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
            animation: fadeIn 0.3s ease both;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .alert.success { background: rgba(76,201,112,0.10);  border: 1px solid rgba(76,201,112,0.25);  color: #b0f0c0; }
        .alert.error   { background: rgba(240,122,122,0.10); border: 1px solid rgba(240,122,122,0.25); color: #ffc8c8; }

        /* ── Input ── */
        .field { margin-bottom: 20px; }
        .field-label {
            display: block;
            font-size: 10px;
            color: rgba(201,168,76,0.8);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .code-input {
            width: 100%;
            padding: 15px 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 11px;
            font: 22px "DM Mono", monospace;
            color: var(--text);
            letter-spacing: 6px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .code-input:focus {
            border-color: rgba(201,168,76,0.55);
            background: rgba(201,168,76,0.04);
            box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
        }
        .code-input::placeholder { color: rgba(255,255,255,0.18); letter-spacing: 4px; font-size: 18px; }

        /* ── Buttons ── */
        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: var(--accent);
            color: #12121d;
            font: 600 14px "DM Sans", sans-serif;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: opacity 0.15s, transform 0.15s;
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent 60%);
            pointer-events: none;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }

        .btn-ghost {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 11px;
            color: var(--muted);
            font: 13px "DM Sans", sans-serif;
            text-decoration: none;
            text-align: center;
            transition: all 0.15s;
            margin-bottom: 8px;
        }
        .btn-ghost:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

    </style>
    <link rel="stylesheet" href="/static/css/performance.css">
</head>
<body>
    <div class="brand-wrap">
        <div class="brand-tag">Restaurants</div>
        <h1>Canjear ticket</h1>
    </div>

    <div class="card">
        <span class="card-icon">🎫</span>
        <h2 class="card-title">Ingresa tu codigo</h2>
        <div class="card-divider"></div>
        <p class="card-sub">Escribe el numero de 6 digitos que aparece en tu ticket para registrarlo en tu cuenta.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if 'exitosamente' in message.message or message.tags == 'success' %}success{% else %}error{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'canjear_ticket' %}">
            {% csrf_token %}
            <div class="field">
                <label class="field-label" for="codigo">Codigo del ticket</label>
                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    class="code-input"
                    placeholder="000000"
                    maxlength="10"
                    autocomplete="off"
                    autofocus
                    inputmode="numeric"
                />
            </div>
            <button class="btn-primary" type="submit">Registrar ticket</button>
        </form>

        <a class="btn-ghost" href="{% url 'menu_cliente' %}">← Volver a mi cuenta</a>
        <a class="btn-ghost" href="{% url 'historial' %}">📋 Ver historial</a>
    </div>
</body>
</html>
